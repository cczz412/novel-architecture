name: WO4 finalize PR description

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wo4-finalize-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-describe-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo4-design-currentness-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          case "$(git rev-parse origin/main)" in
            c79bd0a*) ;;
            *) echo "main moved from c79bd0a" >&2; exit 1 ;;
          esac

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify final WO4 branch
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_design_currentness.py \
            --format json --json-out /tmp/design.json --check >/tmp/design.stdout
          uv run --locked python tools/check_current_freshness.py \
            --format json --json-out /tmp/freshness.json --check >/tmp/freshness.stdout
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_design_currentness.py \
            tests/test_current_freshness.py | tee /tmp/pytest.txt
          uv run --locked ruff check \
            tools/check_design_currentness.py \
            tests/test_design_currentness.py | tee /tmp/ruff.txt

      - name: Build and publish complete PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          design = json.loads(Path('/tmp/design.json').read_text(encoding='utf-8'))
          fresh = json.loads(Path('/tmp/freshness.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('novel-mvp/design/design_registry.json').read_text(encoding='utf-8'))
          pointers = json.loads(Path('governance/current_pointers.json').read_text(encoding='utf-8'))
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          counts = design['summary']['status_counts']
          expected_files = [
              'governance/current_pointers.json',
              'novel-mvp/design/INDEX.md',
              'novel-mvp/design/design_registry.json',
              'tests/test_design_currentness.py',
              'tools/check_design_currentness.py',
          ]
          if sorted(changed) != expected_files + ['.github/workflows/wo4-finalize-pr.yml']:
              raise SystemExit(f'unexpected pre-cleanup diff: {changed}')
          pointer = next(
              row for row in pointers['pointers']
              if row.get('pointer_id') == 'design_registry'
          )
          assert pointer['status'] == 'ACTIVE_REGISTRY'
          assert pointer['path'] == 'novel-mvp/design/design_registry.json'
          assert design['status'] == 'PASS' and design['errors'] == []
          assert fresh['status'] == 'PASS' and fresh['errors'] == []

          body = f'''## 工单

干净基线重构工单 4：设计稿 currentness 登记。

## 当前结论

`READY_FOR_REVIEW`

main 现有设计稿已经完成机器登记、人读 INDEX 对齐、默认路由检查和“先升 R14 设计、再动代码”规则。没有重写任何设计稿正文，也没有带入冻结模块分支的设计改版。

## 版本身份

- Base：`{os.environ['BASE_SHA']}`
- Head（验证时）：`{os.environ['HEAD_SHA']}`
- 冻结参考：`codex/module-runtime-foundation-20260819-r01@cc793c4719fb6470946c70e744f463147989547b`
- 最终业务改动文件数：`5`

## status 统计

```text
设计稿总数 = {design['summary']['design_count']}
默认 CURRENT 路由 = {design['summary']['default_route_count']}
CURRENT = {counts.get('CURRENT', 0)}
WAITING_REWRITE = {counts.get('WAITING_REWRITE', 0)}
HISTORICAL = {counts.get('HISTORICAL', 0)}
SUPERSEDED = {counts.get('SUPERSEDED', 0)}
PR-C 预期后继 = {registry['statistics']['expected_pr_c_successor_count']}
```

## 已落地

- `novel-mvp/design/design_registry.json`：递归登记 design 下每份 Markdown 设计稿，路径唯一；
- 每份登记 `status`、`superseded_by`、R14 关系、INDEX 证据和内容 SHA；
- `novel-mvp/design/INDEX.md`：与 registry 同表对齐，默认入口只列 `CURRENT`；
- 就近重写规则：哪个模块要开工，先把相关设计稿升到 R14 口径并登记为 `CURRENT`，才准动代码；
- 冻结模块分支中的 4 份设计差量只登记为 `WORK_ORDER_5_PR_C` 预期后继，本票没有拣入；
- `tools/check_design_currentness.py`：只读检查 registry 文件闭包、状态、默认路由和 INDEX 对齐；
- `governance/current_pointers.json`：`design_registry` 从计划路径转为 `ACTIVE_REGISTRY`。

## 验收自证

- [x] design 下每份设计稿在 registry 有且只有一个 status；
- [x] `check_design_currentness.py`：PASS，0 errors；
- [x] `check_current_freshness.py`：PASS，0 errors；
- [x] `design_registry.json` 的 `PLANNED_PATH_NOT_MATERIALIZED` 警告已消失；
- [x] 定向 pytest：通过；
- [x] Ruff：通过；
- [x] INDEX 默认路由没有指向 `WAITING_REWRITE`、`HISTORICAL` 或 `SUPERSEDED`；
- [x] 没有修改任何设计稿正文。

## 当前 freshness 剩余 WARNING

`{fresh['summary']['warning_count']}` 条；均不属于 design registry 缺路径。工具正式并入单体 `tool_registry` 仍按计划留工单 7。

## 最终业务文件清单

```text
{chr(10).join(expected_files)}
```

## 禁区核对

没有修改 runtime、合同、需求、R14／R03、`work/`、`references/cloud-supervision/`，也没有复制模块分支设计稿。

## 合并后

停下等待 CZ 合并。不要自动开工单 5。
'''
          Path('/tmp/pr_body.md').write_text(body, encoding='utf-8')
          PY
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --raw-field body="$(cat /tmp/pr_body.md)" >/dev/null

      - name: Remove temporary finalizer and commit clean branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git rm .github/workflows/wo4-finalize-pr.yml
          rmdir .github/workflows .github 2>/dev/null || true
          mapfile -t CHANGED < <(git diff --cached --name-only origin/main)
          EXPECTED=(
            governance/current_pointers.json
            novel-mvp/design/INDEX.md
            novel-mvp/design/design_registry.json
            tests/test_design_currentness.py
            tools/check_design_currentness.py
          )
          printf '%s\n' "${CHANGED[@]}" | sort >/tmp/changed.txt
          printf '%s\n' "${EXPECTED[@]}" | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git diff --cached --check
          git commit -m "docs(design): finalize WO4 review receipt [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
