name: WO5 PR-D final shared-runtime validation

on:
  push:
    branches:
      - chatgpt/wo5-pr-d-shared-runtime-20260821

permissions:
  contents: write

concurrency:
  group: wo5-pr-d-final
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Materialize, verify, clean and push PR-D
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: bash repo/.github/wo5_pr_d_runner.sh
