name: WO2 final targeted validation

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: wo2-final-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo2-semantic-main-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact branch and pin base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = \
            "ae13e9d89d99463bd6fb2e78e1c7930c3549b0d9"

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run all WO2 targeted tests and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_current_freshness.py --check
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_current_freshness.py \
            tests/test_background_board_upload.py
          uv run --locked ruff check tools/check_current_freshness.py

      - name: Remove temporary workflow and prove final scope
        run: |
          set -euo pipefail
          cd repo
          git rm .github/workflows/wo2-final-targeted-validation.yml
          rmdir .github/workflows .github 2>/dev/null || true
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          allowed_exact = {
              'AGENTS.md',
              'README.md',
              'governance/current_pointers.json',
              'tools/check_current_freshness.py',
              'references/atomic-expectations/CURRENT.json',
              'references/atomic-expectations/README.md',
              'references/atomic-expectations/TEST_DESIGN_CURRENT.json',
          }
          allowed_prefixes = (
              'references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/',
              'references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/',
              'references/atomic-expectations/ATOMIC_TEST_DESIGN_20260820_R01/',
          )
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f'WO2 final scope violation: {unexpected}')
          if any(path.startswith('.github/') for path in changed):
              raise SystemExit('temporary workflow remains in final diff')
          print(f'PASS_WO2_FINAL_SCOPE changed_files={len(changed)}')
          PY

      - name: Commit cleanup to the PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git diff --cached --check
          git commit -m "ci: record final WO2 targeted validation [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
