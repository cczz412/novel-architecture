name: WO4 design inventory diagnostic

on:
  push:
    branches:
      - chatgpt/clean-baseline-wo4-design-currentness-20260821

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          echo "HEAD=$(git rev-parse HEAD)"
          git fetch origin main:refs/remotes/origin/main
          echo "MAIN=$(git rev-parse origin/main)"

      - name: Print design inventory and INDEX
        run: |
          set -euo pipefail
          cd repo
          echo '=== DESIGN FILES ==='
          find novel-mvp/design -type f -print | sort
          echo '=== INDEX ==='
          cat novel-mvp/design/INDEX.md
          echo '=== README IF ANY ==='
          test ! -f novel-mvp/design/README.md || cat novel-mvp/design/README.md
          echo '=== FOUR DESIGN DELTAS FROM FROZEN BRANCH ==='
          git fetch origin codex/module-runtime-foundation-20260819-r01:refs/remotes/origin/wo4-source
          git diff --name-status origin/main..refs/remotes/origin/wo4-source -- novel-mvp/design || true
          exit 1
