name: 已停用 Jules 跟读（改用 Codex 原生审查）

# CZ 2026-09-08：改用 Codex 原生 GitHub 审查，见 Issue #330。
# 在 https://chatgpt.com/codex/cloud/settings/code-review 配置自动审查。
# 审查意见留在 PR，Linear 只回链；基础测试仍由 pr-gate 负责。
# 保留这个路牌以便追历史；即使重新启用工作流，也不恢复 Jules 调用。
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: 历史路牌
        run: echo 'Jules 自动跟读已停用。审查由 Codex 原生 GitHub 集成负责。'
