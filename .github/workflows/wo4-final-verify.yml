name: WO4 final verification and cleanup

on:
  push:
    branches:
      - chatgpt/clean-baseline-wo4-design-currentness-20260821

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: wo4-design-currentness
  cancel-in-progress: false

jobs:
  verify-clean-report:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone latest branch and pin current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse origin/main)"
          case "$MAIN_SHA" in
            c79bd0a*) ;;
            *) echo "unexpected main tip: $MAIN_SHA"; exit 1 ;;
          esac
          test -f novel-mvp/design/design_registry.json
          test -f tools/check_design_currentness.py
          test -f tests/test_design_currentness.py

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run final checkers
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_design_currentness.py \
            --format both \
            --json-out /tmp/wo4-design-report.json \
            --check
          uv run --locked python tools/check_current_freshness.py \
            --format both \
            --json-out /tmp/wo4-freshness-report.json \
            --check
          python - <<'PY'
          import json
          from pathlib import Path

          design = json.loads(Path('/tmp/wo4-design-report.json').read_text(encoding='utf-8'))
          fresh = json.loads(Path('/tmp/wo4-freshness-report.json').read_text(encoding='utf-8'))
          assert design['status'] == 'PASS'
          assert design['errors'] == []
          assert design['summary']['design_count'] == design['summary']['unique_path_count']
          assert design['summary']['pr_c_successor_count'] == 4
          assert fresh['status'] == 'PASS'
          assert fresh['errors'] == []
          stale = [
              item for item in fresh['warnings']
              if item.get('code') == 'PLANNED_PATH_NOT_MATERIALIZED'
              and item.get('path') == 'novel-mvp/design/design_registry.json'
          ]
          assert stale == []
          stats = {
              'design_count': design['summary']['design_count'],
              'unique_path_count': design['summary']['unique_path_count'],
              'status_counts': design['summary']['status_counts'],
              'default_route_count': design['summary']['default_route_count'],
              'design_warning_count': design['summary']['warning_count'],
              'design_warning_counts': design['summary']['warning_counts'],
              'pr_c_successor_count': design['summary']['pr_c_successor_count'],
              'freshness_error_count': fresh['summary']['error_count'],
              'freshness_warning_count': fresh['summary']['warning_count'],
          }
          Path('/tmp/wo4-final-stats.json').write_text(
              json.dumps(stats, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('WO4_FINAL_STATS=' + json.dumps(stats, ensure_ascii=False, sort_keys=True))
          PY

      - name: Run final targeted tests and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_design_currentness.py \
            tests/test_current_freshness.py \
            tests/test_traceability.py | tee /tmp/wo4-pytest.log
          uv run --locked ruff check \
            tools/check_design_currentness.py \
            tests/test_design_currentness.py | tee /tmp/wo4-ruff.log

      - name: Remove every temporary helper and stage the exact final write set
        run: |
          set -euo pipefail
          cd repo
          git rm -f --ignore-unmatch \
            .github/wo4_apply.py \
            .github/workflows/wo4-apply.yml \
            .github/workflows/wo4-diagnostic.yml \
            .github/workflows/wo4-final-verify.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git add \
            novel-mvp/design/INDEX.md \
            novel-mvp/design/design_registry.json \
            governance/current_pointers.json \
            tools/check_design_currentness.py \
            tests/test_design_currentness.py

      - name: Prove final PR scope
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main'], text=True
          ).splitlines()
          allowed = {
              'novel-mvp/design/INDEX.md',
              'novel-mvp/design/design_registry.json',
              'governance/current_pointers.json',
              'tools/check_design_currentness.py',
              'tests/test_design_currentness.py',
          }
          if set(changed) != allowed:
              raise SystemExit(
                  f'WO4 exact scope mismatch: missing={sorted(allowed - set(changed))}; '
                  f'extra={sorted(set(changed) - allowed)}'
              )
          print(f'PASS_WO4_FINAL_SCOPE changed_files={len(changed)}')
          for path in changed:
              print(path)
          PY
          git diff --cached --check

      - name: Commit cleanup and push final branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd repo
          git commit -m "ci: record final WO4 verification [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Post machine receipt to PR 13
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(git rev-parse origin/main)"
          STATS="$(cat /tmp/wo4-final-stats.json)"
          PYTEST_RESULT="$(tail -n 1 /tmp/wo4-pytest.log)"
          RUFF_RESULT="$(tail -n 1 /tmp/wo4-ruff.log)"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stats = json.loads(Path('/tmp/wo4-final-stats.json').read_text(encoding='utf-8'))
          lines = [
              '## WO4 final machine receipt',
              '',
              f"- Base: `{os.environ['BASE_SHA']}`",
              f"- Head: `{os.environ['HEAD_SHA']}`",
              f"- Designs: `{stats['design_count']}`; unique paths: `{stats['unique_path_count']}`",
              f"- Status counts: `{json.dumps(stats['status_counts'], ensure_ascii=False, sort_keys=True)}`",
              f"- Default routes: `{stats['default_route_count']}`",
              f"- Expected PR-C successors: `{stats['pr_c_successor_count']}`",
              f"- Design checker: `PASS`, errors `0`, warnings `{stats['design_warning_count']}`",
              f"- Freshness checker: `PASS`, errors `{stats['freshness_error_count']}`, warnings `{stats['freshness_warning_count']}`",
              f"- Pytest: `{os.environ['PYTEST_RESULT']}`",
              f"- Ruff: `{os.environ['RUFF_RESULT']}`",
              '- Final scope: exactly 5 files; temporary `.github/` helpers removed.',
          ]
          Path('/tmp/wo4-pr-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/13/comments" \
            -f body="$(cat /tmp/wo4-pr-comment.md)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PYTEST_RESULT: "targeted pytest passed"
          RUFF_RESULT: "All checks passed"
