name: WO3 traceability materialization and validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: wo3-traceability-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo3-traceability-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact branch and pin main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = \
            "3d3a0afcc3a5479d11ce84f96995c78aea917510"

      - name: Materialize work order 3
        run: |
          set -euo pipefail
          cd repo
          python -m py_compile .github/wo3_apply.py
          python .github/wo3_apply.py
          python -m json.tool governance/capability_traceability.json >/dev/null
          python -m json.tool governance/current_pointers.json >/dev/null
          python -m json.tool references/atomic-expectations/TEST_DESIGN_CURRENT.json >/dev/null
          python -m py_compile tools/check_traceability.py

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Validate traceability and current pointers
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_traceability.py \
            --format both \
            --json-out /tmp/wo3-traceability-report.json \
            --check
          uv run --locked python tools/check_current_freshness.py \
            --format both \
            --json-out /tmp/wo3-freshness-report.json \
            --check
          python - <<'PY'
          import json
          from pathlib import Path

          trace = json.loads(Path('/tmp/wo3-traceability-report.json').read_text(encoding='utf-8'))
          freshness = json.loads(Path('/tmp/wo3-freshness-report.json').read_text(encoding='utf-8'))
          assert trace['status'] == 'PASS'
          assert trace['errors'] == []
          assert trace['summary']['row_count'] == 142
          assert trace['summary']['unique_id_count'] == 142
          assert freshness['status'] == 'PASS'
          assert freshness['errors'] == []
          stale = [
              item for item in freshness['warnings']
              if item.get('code') == 'PLANNED_PATH_NOT_MATERIALIZED'
              and item.get('path') == 'governance/capability_traceability.json'
          ]
          assert stale == []
          stats = {
              'unassigned_count': trace['summary']['unassigned_count'],
              'warning_count': trace['summary']['warning_count'],
              'warning_counts': trace['summary']['warning_counts'],
              'freshness_warning_count': freshness['summary']['warning_count'],
          }
          print('WO3_STATS=' + json.dumps(stats, ensure_ascii=False, sort_keys=True))
          PY

      - name: Run targeted tests and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_traceability.py \
            tests/test_current_freshness.py \
            tests/test_background_board_upload.py
          uv run --locked ruff check \
            tools/check_traceability.py \
            tests/test_traceability.py

      - name: Remove temporary execution helpers
        run: |
          set -euo pipefail
          cd repo
          git rm .github/wo3_apply.py .github/workflows/wo3-apply.yml
          rmdir .github/workflows .github 2>/dev/null || true

      - name: Enforce exact WO3 write set
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          allowed_exact = {
              'governance/capability_traceability.json',
              'governance/current_pointers.json',
              'references/atomic-expectations/TEST_DESIGN_CURRENT.json',
              'tools/check_traceability.py',
              'tests/test_traceability.py',
          }
          allowed_prefixes = (
              'references/atomic-expectations/ATOMIC_TEST_DESIGN_R03_ADDENDUM_20260821_R01/',
          )
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          forbidden_prefixes = (
              '.github/',
              'work/',
              'novel-mvp/',
              'references/cloud-supervision/',
              'references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/',
              'references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/',
          )
          forbidden = [path for path in changed if path.startswith(forbidden_prefixes)]
          if unexpected:
              raise SystemExit(f'WO3 unexpected paths: {unexpected}')
          if forbidden:
              raise SystemExit(f'WO3 forbidden paths: {forbidden}')
          missing = sorted(allowed_exact - set(changed))
          if missing:
              raise SystemExit(f'WO3 expected paths missing: {missing}')
          print(f'PASS_WO3_SCOPE changed_files={len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Commit verified result to the PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git add \
            governance/capability_traceability.json \
            governance/current_pointers.json \
            references/atomic-expectations/TEST_DESIGN_CURRENT.json \
            references/atomic-expectations/ATOMIC_TEST_DESIGN_R03_ADDENDUM_20260821_R01 \
            tools/check_traceability.py \
            tests/test_traceability.py
          git diff --cached --check
          git commit -m "feat(governance): add reviewed traceability and R03 test addendum [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
