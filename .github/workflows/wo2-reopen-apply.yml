name: WO2 semantic migration on PR reopen

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

concurrency:
  group: wo2-semantic-reopen-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo2-semantic-main-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone exact branch and frozen source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git fetch origin \
            codex/module-runtime-foundation-20260819-r01:refs/remotes/origin/wo2-source
          test "$(git rev-parse origin/main)" = \
            "ae13e9d89d99463bd6fb2e78e1c7930c3549b0d9"
          test "$(git rev-parse refs/remotes/origin/wo2-source)" = \
            "cc793c4719fb6470946c70e744f463147989547b"

      - name: Apply work order 2 entry-point migration
        run: |
          set -euo pipefail
          cd repo
          python -m py_compile .github/wo2_apply.py
          python .github/wo2_apply.py
          python -m json.tool governance/current_pointers.json >/dev/null
          python -m py_compile tools/check_current_freshness.py

      - name: Prove copied semantic packages are frozen-source identical
        run: |
          set -euo pipefail
          cd repo
          SOURCE=refs/remotes/origin/wo2-source
          git diff --exit-code "$SOURCE" -- \
            references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14 \
            references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03 \
            references/atomic-expectations/ATOMIC_TEST_DESIGN_20260820_R01 \
            references/atomic-expectations/CURRENT.json \
            references/atomic-expectations/README.md \
            references/atomic-expectations/TEST_DESIGN_CURRENT.json

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify current freshness and warning closure
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_current_freshness.py \
            --format both \
            --json-out /tmp/wo2-current-freshness.json \
            --check
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/wo2-current-freshness.json').read_text(encoding='utf-8')
          )
          assert report['status'] == 'PASS'
          assert report['errors'] == []
          stale = [
              item
              for item in report['warnings']
              if item.get('code') == 'PLANNED_PATH_NOT_MATERIALIZED'
              and item.get('path')
              == 'references/atomic-expectations/TEST_DESIGN_CURRENT.json'
          ]
          assert stale == []
          print(
              'PASS_WO2_FRESHNESS '
              f"errors={len(report['errors'])} "
              f"warnings={len(report['warnings'])} "
              'test_design_warning=closed'
          )
          PY

      - name: Run targeted tests and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_current_freshness.py \
            tests/test_governance_index.py
          uv run --locked ruff check tools/check_current_freshness.py

      - name: Remove temporary execution helpers
        run: |
          set -euo pipefail
          cd repo
          git rm \
            .github/wo2_apply.py \
            .github/workflows/wo2-reopen-apply.yml
          rmdir .github/workflows .github 2>/dev/null || true

      - name: Enforce final WO2 write set and forbidden paths
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines()
          allowed_exact = {
              'AGENTS.md',
              'README.md',
              'governance/current_pointers.json',
              'tools/check_current_freshness.py',
              'references/atomic-expectations/CURRENT.json',
              'references/atomic-expectations/README.md',
              'references/atomic-expectations/TEST_DESIGN_CURRENT.json',
          }
          allowed_prefixes = (
              'references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/',
              'references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/',
              'references/atomic-expectations/ATOMIC_TEST_DESIGN_20260820_R01/',
          )
          forbidden_prefixes = (
              '.github/',
              'references/cloud-supervision/',
              'work/advisory_returns_20260820_r01/',
              'novel-mvp/',
              'tests/',
          )
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and not path.startswith(allowed_prefixes)
          ]
          forbidden = [
              path
              for path in changed
              if path.startswith(forbidden_prefixes)
          ]
          if unexpected:
              raise SystemExit(f'WO2 unexpected paths: {unexpected}')
          if forbidden:
              raise SystemExit(f'WO2 forbidden paths: {forbidden}')
          missing = sorted(allowed_exact - set(changed))
          if missing:
              raise SystemExit(f'WO2 expected paths missing: {missing}')
          print(f'PASS_WO2_SCOPE changed_files={len(changed)}')
          for path in changed:
              print(path)
          PY

      - name: Commit verified result to the PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git add \
            AGENTS.md \
            README.md \
            governance/current_pointers.json \
            tools/check_current_freshness.py
          git diff --cached --check
          git commit -m "docs(semantics): promote R14 and atomic R03 [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
