name: WO5 PR-C validation bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: wo5-pr-c-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  kick-push-runner:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/wo5-pr-c-product-architecture-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push one self-cleaning bootstrap commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wo5-pr-c-kick.yml
          git commit -m "ci: start WO5 PR-C validation"
          git push origin "HEAD:${BRANCH_NAME}"
