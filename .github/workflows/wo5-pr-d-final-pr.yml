name: WO5 PR-D final validation from pull request

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: wo5-pr-d-final-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/wo5-pr-d-shared-runtime-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Materialize, verify, clean and push PR-D
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: bash repo/.github/wo5_pr_d_runner.sh
