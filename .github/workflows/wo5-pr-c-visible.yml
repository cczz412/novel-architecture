name: WO5 PR-C visible materialization and validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: wo5-pr-c-visible-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/wo5-pr-c-product-architecture-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Clone the exact PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Materialize, validate, clean, and push PR-C
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: bash repo/.github/wo5_pr_c_runner.sh
