name: WO5 PR-D shared-runtime selection snapshot

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  select:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/wo5-pr-d-shared-runtime-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and persist compact selection snapshot
        run: |
          set -euo pipefail
          cd repo
          python -m py_compile .github/wo5_pr_d_select.py
          python .github/wo5_pr_d_select.py
          python -m json.tool .github/wo5_pr_d_selection.json >/dev/null
          git add .github/wo5_pr_d_selection.json
          git commit -m "ci: persist PR-D selection snapshot [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
