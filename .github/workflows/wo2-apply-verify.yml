name: WO2 semantic layer apply and verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wo2-semantic-layer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo2-semantic-main-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clone exact work-order branch and frozen source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git fetch origin \
            codex/module-runtime-foundation-20260819-r01:refs/remotes/origin/wo2-source

      - name: Update semantic entry points only
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import json
          from pathlib import Path

          R13 = "references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260814_R13/00_READ_ME_FIRST.md"
          R14 = "references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/00_READ_ME_FIRST.md"
          ATOMIC_CURRENT = "references/atomic-expectations/CURRENT.json"
          TEST_CURRENT = "references/atomic-expectations/TEST_DESIGN_CURRENT.json"
          SOURCE_BRANCH = "codex/module-runtime-foundation-20260819-r01"
          SOURCE_COMMIT = "cc793c4719fb6470946c70e744f463147989547b"
          UPDATED_AT = "2026-08-21T04:34:14+08:00"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, got {count}")
              return text.replace(old, new, 1)

          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          agents = replace_once(
              agents,
              "| **共同背景板（现行）** | [R13 本地入口](references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260814_R13/00_READ_ME_FIRST.md) · [Notion 镜像](https://app.notion.com/p/3be5cadc4d0f81ab8c21deafb82d89c3) | 仓里没有叫 SHARE TEXT 的文件；就是这一包 |",
              "| **共同背景板（现行）** | [R14 本地入口](references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/00_READ_ME_FIRST.md) | R13 已标为 superseded 并留在 Git；旧 Notion 镜像不冒充 R14 |",
              "AGENTS product table",
          )
          agents = replace_once(
              agents,
              "| **原子需求与验收背景板** | [当前入口](references/atomic-expectations/README.md) | 说明局部能力要给用户什么、怎样验收；不是当前进度或施工票 |",
              "| **原子需求与验收背景板** | [R03 CURRENT](references/atomic-expectations/CURRENT.json) · [人读入口](references/atomic-expectations/README.md) | 142 条需求；六例设计 CURRENT 仍只覆盖旧 127 条 |",
              "AGENTS atomic table",
          )
          agents = replace_once(
              agents,
              "- 产品共同理解从 [共同背景板 R13 本地入口](references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260814_R13/00_READ_ME_FIRST.md) 开始；需要在 Notion 阅读时走[新工作页镜像](https://app.notion.com/p/3be5cadc4d0f81ab8c21deafb82d89c3)。它不是执行票、训练许可、当前状态或生产默认；简单机械任务直接走下表，不通读整包。",
              "- 产品共同理解从 [共同背景板 R14 本地入口](references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/00_READ_ME_FIRST.md) 开始。R13 仍留 Git 供追溯，但已经退出默认路由；旧 Notion 镜像不代表 R14。它不是执行票、训练许可、当前状态或生产默认；简单机械任务直接走下表，不通读整包。",
              "AGENTS product authority",
          )
          agents = replace_once(
              agents,
              "- 原子需求与验收背景将在工单 2 以正式 CURRENT 上 main；工单 1 期间只从 [`governance/current_pointers.json`](governance/current_pointers.json) 查看候选身份，不把候选分支文件冒充 main current。",
              "- 原子需求与验收背景只认 [R03 CURRENT](references/atomic-expectations/CURRENT.json)：142 条唯一 ID；人读入口见 [README](references/atomic-expectations/README.md)。旧 R02 留 Git 作历史并退出默认路由；[六例测试设计 CURRENT](references/atomic-expectations/TEST_DESIGN_CURRENT.json) 仍只覆盖旧 127 条／762 例，不能冒充覆盖 R03 新增 15 条。",
              "AGENTS atomic authority",
          )
          agents = replace_once(
              agents,
              "| 查模块长期需求、测试配方或评分维度 | `references/atomic-expectations/README.md` | 按预期 ID 读取人读版或机器 JSON；当前实现仍回代码、合同和结果票核对 |",
              "| 查模块长期需求、测试配方或评分维度 | `references/atomic-expectations/CURRENT.json` | 人读看 `README.md`；机器内容看 R03 包；旧六例设计另看 `TEST_DESIGN_CURRENT.json` |",
              "AGENTS atomic route",
          )
          if R13 in agents or "将在工单 2" in agents:
              raise SystemExit("AGENTS still exposes a superseded or placeholder route")
          for required in (R14, ATOMIC_CURRENT, TEST_CURRENT):
              if required not in agents:
                  raise SystemExit(f"AGENTS missing {required}")
          agents_path.write_text(agents, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "| `references/` | 书目、调查、外部诊断；**共同背景板在这里的 `shared-context/`** | [参考区说明](references/README.md) | 候选材料，不作真值；R13 是共同理解，仍不是执行票 |",
              "| `references/` | 书目、调查、外部诊断；共同背景板和原子需求都在这里 | [R14 共同背景](references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/00_READ_ME_FIRST.md)＋[R03 原子需求 CURRENT](references/atomic-expectations/CURRENT.json)＋[参考区说明](references/README.md) | 候选材料不作运行真值；R14／R03 是当前语义入口，不证明实现完成 |",
              "README references row",
          )
          readme = replace_once(
              readme,
              "<!-- active_product_background: references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260814_R13/00_READ_ME_FIRST.md -->",
              "<!-- active_product_background: references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/00_READ_ME_FIRST.md -->\n<!-- active_atomic_expectations: references/atomic-expectations/CURRENT.json -->",
              "README active pointers",
          )
          if R13 in readme:
              raise SystemExit("README still exposes R13 as an active path")
          for required in (R14, ATOMIC_CURRENT):
              if required not in readme:
                  raise SystemExit(f"README missing {required}")
          readme_path.write_text(readme, encoding="utf-8")

          pointers_path = Path("governance/current_pointers.json")
          pointers = json.loads(pointers_path.read_text(encoding="utf-8"))
          pointers["updated_at"] = UPDATED_AT
          rows = pointers.get("pointers")
          if not isinstance(rows, list):
              raise SystemExit("current_pointers.pointers must be a list")
          by_id = {row.get("pointer_id"): row for row in rows if isinstance(row, dict)}

          product = by_id["product_background"]
          product.clear()
          product.update({
              "pointer_id": "product_background",
              "status": "ACTIVE_CURRENT",
              "version": "R14",
              "path": R14,
              "source": {
                  "branch": SOURCE_BRANCH,
                  "commit": SOURCE_COMMIT,
                  "admitted_by_work_order": 2,
              },
              "supersedes": {
                  "version": "R13",
                  "path": R13,
                  "status": "SUPERSEDED_HISTORICAL",
              },
          })

          atomic = by_id["atomic_expectations"]
          atomic.clear()
          atomic.update({
              "pointer_id": "atomic_expectations",
              "status": "ACTIVE_CURRENT",
              "version": "R03",
              "path": ATOMIC_CURRENT,
              "entry_path": "references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/00_READ_ME_FIRST.md",
              "manifest_path": "references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/MANIFEST.json",
              "record_count": 142,
              "source": {
                  "branch": SOURCE_BRANCH,
                  "commit": SOURCE_COMMIT,
                  "admitted_by_work_order": 2,
              },
              "supersedes": {
                  "version": "R02",
                  "path": "references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260819_R02/00_READ_ME_FIRST.md",
                  "status": "SUPERSEDED_HISTORICAL",
              },
          })

          design = by_id["atomic_test_design"]
          design.clear()
          design.update({
              "pointer_id": "atomic_test_design",
              "status": "ACTIVE_CURRENT",
              "version": "R01_FOR_R02_127",
              "path": TEST_CURRENT,
              "covered_expectations": 127,
              "designed_test_cases": 762,
              "scope_status": "CURRENT_PARTIAL_COVERAGE_FOR_R03",
              "source": {
                  "branch": SOURCE_BRANCH,
                  "commit": SOURCE_COMMIT,
                  "admitted_by_work_order": 2,
              },
              "boundary": "只覆盖 R02 的 127 条／762 例；不能冒充覆盖 R03 新增 15 条，新增 90 例留给工单 3。",
          })

          pointers["invariants"] = [
              "repository_current、product_background 与 atomic_expectations 各自只有一个 ACTIVE_CURRENT。",
              "产品共同背景现行只认 R14；R13 留 Git 作 SUPERSEDED_HISTORICAL。",
              "原子需求现行只认 R03／142 条唯一 ID；R02 留 Git 作 SUPERSEDED_HISTORICAL。",
              "六例设计 CURRENT 仍只覆盖旧 127 条／762 例，不得冒充覆盖 R03 新增 15 条。",
              "候选分支、PLANNED 和 PENDING_WORK_ORDER 不得冒充 main current。",
              "本表不保存运行分数，不替代正式合同、结果票或 CZ 拍板。",
          ]
          pointers_path.write_text(
              json.dumps(pointers, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          checker_path = Path("tools/check_current_freshness.py")
          checker = checker_path.read_text(encoding="utf-8")
          checker = replace_once(
              checker,
              '''    product_path = by_id.get("product_background", {}).get("path")
    if not isinstance(product_path, str) or not (root / product_path).is_file():
        errors.append(_issue("ERROR", "PRODUCT_BACKGROUND_MISSING", "active product background path is missing", str(product_path)))
    elif not product_path.endswith("NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260814_R13/00_READ_ME_FIRST.md"):
        errors.append(_issue("ERROR", "WO1_BACKGROUND_VERSION", "work order 1 must keep R13 active; R14 belongs to work order 2", product_path))

    for label, content, path in (
        ("AGENTS", agents, "AGENTS.md"),
        ("README", readme, "README.md"),
        ("progress", progress, "governance/progress/current-progress.md"),
    ):
        for required in ("governance/CURRENT_STATE.json", "governance/current_pointers.json", product_path):
            if required not in content:
                errors.append(_issue("ERROR", "ENTRYPOINT_MISMATCH", f"{label} does not name {required}", path))
''',
              '''    product_row = by_id.get("product_background", {})
    product_path = product_row.get("path")
    product_version = product_row.get("version")
    if not isinstance(product_path, str) or not (root / product_path).is_file():
        errors.append(_issue("ERROR", "PRODUCT_BACKGROUND_MISSING", "active product background path is missing", str(product_path)))
    elif not product_path.endswith("/00_READ_ME_FIRST.md"):
        errors.append(_issue("ERROR", "PRODUCT_BACKGROUND_ENTRY", "active product background must point to 00_READ_ME_FIRST.md", product_path))
    elif isinstance(product_version, str) and f"_{product_version}/00_READ_ME_FIRST.md" not in product_path:
        errors.append(_issue("ERROR", "PRODUCT_BACKGROUND_VERSION", "product background version and path disagree", product_path))

    semantic_requirements = [
        "governance/CURRENT_STATE.json",
        "governance/current_pointers.json",
    ]
    if isinstance(product_path, str):
        semantic_requirements.append(product_path)
    for label, content, path in (
        ("AGENTS", agents, "AGENTS.md"),
        ("README", readme, "README.md"),
    ):
        for required in semantic_requirements:
            if required not in content:
                errors.append(_issue("ERROR", "ENTRYPOINT_MISMATCH", f"{label} does not name {required}", path))

    for required in ("governance/CURRENT_STATE.json", "governance/current_pointers.json"):
        if required not in progress:
            errors.append(_issue("ERROR", "ENTRYPOINT_MISMATCH", f"progress does not name {required}", "governance/progress/current-progress.md"))
''',
              "freshness product gate",
          )
          checker_path.write_text(checker, encoding="utf-8")
          PY

          python -m json.tool governance/current_pointers.json >/dev/null
          python -m py_compile tools/check_current_freshness.py

      - name: Verify frozen-source byte identity and ticket scope
        run: |
          set -euo pipefail
          cd repo
          SOURCE=refs/remotes/origin/wo2-source
          git diff --exit-code "$SOURCE" -- \
            references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14 \
            references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03 \
            references/atomic-expectations/ATOMIC_TEST_DESIGN_20260820_R01 \
            references/atomic-expectations/CURRENT.json \
            references/atomic-expectations/README.md \
            references/atomic-expectations/TEST_DESIGN_CURRENT.json

          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/wo2-apply-verify.yml",
              "AGENTS.md",
              "README.md",
              "governance/current_pointers.json",
              "tools/check_current_freshness.py",
              "references/atomic-expectations/CURRENT.json",
              "references/atomic-expectations/README.md",
              "references/atomic-expectations/TEST_DESIGN_CURRENT.json",
          }
          allowed_prefixes = (
              "references/shared-context/NOVEL_ARCH_SHARED_CONTEXT_CORE_MATERIALS_20260820_R14/",
              "references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/",
              "references/atomic-expectations/ATOMIC_TEST_DESIGN_20260820_R01/",
          )
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"WO2 scope violation: {unexpected}")
          forbidden = (
              "references/cloud-supervision/",
              "work/advisory_returns_20260820_r01/",
              "novel-mvp/",
              "tests/",
          )
          leaked = [path for path in changed if path.startswith(forbidden)]
          if leaked:
              raise SystemExit(f"WO2 forbidden paths changed: {leaked}")
          print(f"PASS_WO2_SCOPE changed_files={len(changed)}")
          PY

      - name: Install locked tool runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify R14, R03 and 142 unique expectation IDs
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_current_freshness.py \
            --format both --json-out /tmp/wo2-freshness.json --check

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          pointers = json.loads((root / "governance/current_pointers.json").read_text(encoding="utf-8"))
          rows = [row for row in pointers["pointers"] if isinstance(row, dict)]
          by_id = {row["pointer_id"]: row for row in rows}

          product = by_id["product_background"]
          assert product["status"] == "ACTIVE_CURRENT"
          assert product["version"] == "R14"
          assert product["supersedes"]["version"] == "R13"
          assert product["supersedes"]["status"] == "SUPERSEDED_HISTORICAL"
          assert (root / product["path"]).is_file()

          atomic_pointer = by_id["atomic_expectations"]
          assert atomic_pointer["status"] == "ACTIVE_CURRENT"
          assert atomic_pointer["version"] == "R03"
          assert atomic_pointer["record_count"] == 142
          assert atomic_pointer["supersedes"]["version"] == "R02"
          assert atomic_pointer["supersedes"]["status"] == "SUPERSEDED_HISTORICAL"

          atomic_current = json.loads((root / atomic_pointer["path"]).read_text(encoding="utf-8"))
          assert atomic_current["current_version"] == "R03"
          assert (root / atomic_current["entry_path"]).is_file()
          assert (root / atomic_current["manifest_path"]).is_file()

          data_path = root / "references/atomic-expectations/ATOMIC_EXPECTATION_BACKGROUND_20260820_R03/02_ATOMIC_EXPECTATIONS.json"
          data = json.loads(data_path.read_text(encoding="utf-8"))
          assert data["totals"]["records"] == 142

          lists = []
          def walk(value):
              if isinstance(value, dict):
                  for nested in value.values():
                      walk(nested)
              elif isinstance(value, list):
                  if len(value) == 142 and all(isinstance(item, dict) for item in value):
                      lists.append(value)
                  for nested in value:
                      walk(nested)
          walk(data)

          matches = []
          for records in lists:
              common = set(records[0])
              for record in records[1:]:
                  common &= set(record)
              for key in sorted(common):
                  values = [record.get(key) for record in records]
                  if "id" not in key.lower():
                      continue
                  if all(isinstance(value, str) and value for value in values) and len(set(values)) == 142:
                      matches.append((key, values))
          if not matches:
              raise SystemExit("could not locate one 142-row unique expectation ID field")
          preferred = [item for item in matches if item[0] in {"expectation_id", "预期ID", "id"}]
          key, ids = (preferred or matches)[0]
          assert len(ids) == len(set(ids)) == 142

          test_pointer = by_id["atomic_test_design"]
          assert test_pointer["status"] == "ACTIVE_CURRENT"
          assert test_pointer["covered_expectations"] == 127
          assert test_pointer["designed_test_cases"] == 762
          assert (root / test_pointer["path"]).is_file()

          freshness = json.loads(Path("/tmp/wo2-freshness.json").read_text(encoding="utf-8"))
          assert freshness["status"] == "PASS"
          assert not freshness["errors"]
          stale_test_design_warnings = [
              item for item in freshness["warnings"]
              if item.get("code") == "PLANNED_PATH_NOT_MATERIALIZED"
              and item.get("path") == "references/atomic-expectations/TEST_DESIGN_CURRENT.json"
          ]
          assert stale_test_design_warnings == []
          print(f"PASS_WO2_SEMANTIC_CURRENT id_field={key} unique_ids={len(ids)}")
          PY

      - name: Run targeted tests and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_current_freshness.py \
            tests/test_background_board_upload.py
          uv run --locked ruff check tools/check_current_freshness.py

      - name: Commit verified work-order result and remove bootstrap workflow
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git rm .github/workflows/wo2-apply-verify.yml
          git add \
            AGENTS.md \
            README.md \
            governance/current_pointers.json \
            tools/check_current_freshness.py
          git diff --cached --check
          git commit -m "docs(semantics): promote R14 and atomic R03 [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
