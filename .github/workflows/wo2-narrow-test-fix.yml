name: WO2 narrow test fix validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: wo2-narrow-test-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-clean:
    if: ${{ github.event.pull_request.head.ref == 'chatgpt/clean-baseline-wo2-semantic-main-20260821' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

      - name: Prove the test diff is limited to the approved function
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          import subprocess
          from pathlib import Path

          patch = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "origin/main",
                  "--unified=3",
                  "--",
                  "tests/test_background_board_upload.py",
              ],
              text=True,
          )
          source = Path("tests/test_background_board_upload.py").read_text(
              encoding="utf-8"
          )
          required_patch = (
              'def test_current_atomic_board_is_stable_projection()',
              'assert len(records) == totals["records"]',
              'assert len({row["预期ID"] for row in records}) == len(records)',
              'row["当前产品判断"]["层级"] == "核心"',
              'row["当前产品判断"]["层级"] == "附加"',
              'row["现行验收参考"]["需要真实小说"]',
          )
          for marker in required_patch:
              if marker not in patch:
                  raise SystemExit(f"missing approved marker: {marker}")
          forbidden_source = (
              'assert len(records) == 127',
              'assert len({row["预期ID"] for row in records}) == 127',
              '"records": 127,\n        "core": 78,',
              '"bonus": 49,',
              '"needs_real_novel": 44,',
          )
          for marker in forbidden_source:
              if marker in source:
                  raise SystemExit(f"version-locked assertion remains: {marker}")
          if patch.count("def test_") != 1:
              raise SystemExit("target test diff reaches another test function")
          print("PASS_WO2_APPROVED_TEST_FUNCTION_DIFF")
          PY

      - name: Install locked runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run requested tests, freshness check, and Ruff
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest \
            tests/test_background_board_upload.py \
            tests/test_current_freshness.py -q
          uv run --locked python tools/check_current_freshness.py \
            --format both \
            --json-out /tmp/wo2-freshness.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/wo2-freshness.json").read_text(encoding="utf-8")
          )
          assert report["status"] == "PASS"
          assert report["errors"] == []
          print(
              "PASS_WO2_NARROW_FRESHNESS "
              f"errors={len(report['errors'])} "
              f"warnings={len(report['warnings'])}"
          )
          PY
          uv run --locked ruff check \
            tests/test_background_board_upload.py \
            tools/check_current_freshness.py

      - name: Remove temporary workflows and commit cleanup
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repo
          git rm \
            .github/workflows/wo2-narrow-test-fix.yml \
            .github/workflows/wo2-narrow-test-fix-push.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git diff --cached --check
          git commit -m "ci: remove temporary WO2 validation workflows [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
