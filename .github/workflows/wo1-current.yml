name: WO1 current convergence

on:
  push:
    branches:
      - chatgpt/clean-baseline-wo1-current-20260821
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wo1-current-convergence
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact work-order branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --branch "$BRANCH_NAME" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

      - name: Materialize isolated work-order script
        env:
          WO1_SCRIPT_GZIP_BASE64: ""
        run: |
          set -euo pipefail
          python - <<'PY2'
          import base64, gzip, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ["WO1_SCRIPT_GZIP_BASE64"]))
          Path("/tmp/wo1_apply.py").write_bytes(raw)
          PY2
          python -m py_compile /tmp/wo1_apply.py

      - name: Apply work order 1 migration
        run: |
          set -euo pipefail
          cp /tmp/wo1_apply.py repo/work/wo1_apply.py
          cd repo
          python work/wo1_apply.py
          rm work/wo1_apply.py

      - name: Install locked tool runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify current surfaces and targeted tests
        run: |
          set -euo pipefail
          cd repo
          uv run --locked python tools/check_current_freshness.py --check
          uv run --locked pytest -q -p no:cacheprovider tests/test_current_freshness.py tests/test_governance_index.py
          uv run --locked ruff check tools/check_current_freshness.py tests/test_current_freshness.py

      - name: Run full repository regression
        run: |
          set -euo pipefail
          cd repo
          uv run --locked pytest -q -p no:cacheprovider

      - name: Commit verified work-order changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd repo
          git add \
            AGENTS.md README.md current.md \
            history/root_current_snapshot_20260720.md \
            governance/CURRENT_STATE.json \
            governance/CURRENT_STATE_HISTORY.json \
            governance/INDEX.md \
            governance/current_run.md \
            governance/current_pointers.json \
            governance/index_manifest.json \
            governance/progress/current-progress.md \
            governance/tool_registry.json \
            tools/check_current_freshness.py \
            tests/test_current_freshness.py
          git diff --cached --check
          git commit -m "chore(governance): converge repository current state [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
